name: Publish installable debug APK
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build run containing the verified Android artifact
        required: true
  workflow_run:
    workflows: [Build DEADWAVE HEROES]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish-debug-download:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      RELEASE_TAG: v0.2.12-debug
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download the already tested APK
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DeadwaveHeroes-v0.2.12-debug --dir release-assets
      - name: Verify APK matches the successful build manifest
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('release-assets')
          name='DeadwaveHeroes-v0.2.12-debug.apk'
          info=json.loads((root/'manifest.json').read_text())[name]
          apk=root/name
          assert apk.stat().st_size==info['bytes'], 'APK size mismatch'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==info['sha256'], 'APK SHA-256 mismatch'
          (root/'SHA256SUMS.txt').write_text(info['sha256']+'  '+name+'\n')
          print('APK verified against successful build manifest')
          PY
      - name: Publish direct download as an explicitly marked debug prerelease
        run: |
          cat > /tmp/deadwave-release-notes.md <<'NOTES'
          Spielbarer Prototyp v0.2.12 von RF Worlds. Die APK unten direkt herunterladen und auf Android installieren. Android 7 oder neuer, ARMv7/ARM64. Die Datei stammt unverändert aus dem zugehörigen erfolgreich geprüften GitHub-Build.

          Perfect Orbit: Ein wanderndes Goldfenster belohnt präzise Abwürfe mit einer hindernisdurchdringenden Goldkugel und einmalig +12% Orbitalladung beim Sammeln. Je zwei überschüssige Munition liefern 1% Ladung. Der separat auslösbare Orbitalschlag markiert Ziele 0,45 Sekunden vor dem Einschlag, hat acht Sekunden Abklingzeit und trifft Bosse höchstens für 12% Maximalleben. Kein zusätzlicher Munitionsverbrauch. Schnelle automatische Schiene und Bonusspiele bleiben erhalten.

          Das Savegame-Format bleibt kompatibel. Der Debug-Schlüssel wird aus dem Buildcache wiederverwendet.

          Debug-Testversion: kein fertiger Release und noch nicht auf einem physischen Smartphone getestet. Bei Bedarf die Installation aus dieser Downloadquelle erlauben. Windows und Buildprotokolle stehen im ursprünglichen Actions-Lauf bereit.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version already has a direct download; keeping its existing APK."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title 'DEADWAVE HEROES v0.2.12 · Android Debug' --notes-file /tmp/deadwave-release-notes.md release-assets/DeadwaveHeroes-v0.2.12-debug.apk release-assets/SHA256SUMS.txt docs/screenshots/orbital-strike-v0.2.12.png docs/screenshots/perfect-drop-v0.2.12.png docs/previews/DeadwaveHeroes-v0.2.12-motion.mp4

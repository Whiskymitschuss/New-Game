name: Publish installable debug APK
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful build run containing the verified Android artifact
        required: true
  workflow_run:
    workflows: [Build DEADWAVE HEROES]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: read
jobs:
  publish-debug-download:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      RELEASE_TAG: v0.2.7-debug
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download the already tested APK
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name DeadwaveHeroes-v0.2.7-debug --dir release-assets
      - name: Verify APK matches the successful build manifest
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('release-assets')
          name='DeadwaveHeroes-v0.2.7-debug.apk'
          info=json.loads((root/'manifest.json').read_text())[name]
          apk=root/name
          assert apk.stat().st_size==info['bytes'], 'APK size mismatch'
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==info['sha256'], 'APK SHA-256 mismatch'
          (root/'SHA256SUMS.txt').write_text(info['sha256']+'  '+name+'\n')
          print('APK verified against successful build manifest')
          PY
      - name: Publish direct download as an explicitly marked debug prerelease
        run: |
          cat > /tmp/deadwave-release-notes.md <<'NOTES'
          Spielbarer Prototyp v0.2.7 von RF Worlds. Die APK unten direkt herunterladen und auf Android installieren. Android 7 oder neuer, ARMv7/ARM64. Die Datei stammt unverändert aus dem zugehörigen erfolgreich geprüften GitHub-Build.

          Circuit & Gear: neue Energieaperturen mit echten Multiplikatoren ab ×2; freie Strecken ohne ×1-Hardware. Drei bis vier physische Hindernisse und ein funktionierendes Portalpaar pro Einsatz. Seltene Powerzellen für Spezialenergie, fünf Sekunden Overdrive oder Schild. Gürtel, Patronentaschen, Panzerplatten und Waffenanbauten folgen den tatsächlichen Upgrades; die ersten Tutorial-Auswahlen machen Gürtel und Panzer direkt zugänglich. Spielstand, Waffenfreischaltungen und Hintergrundmusik bleiben integriert. Frühere Reaktorgeometrie wird einmalig aktualisiert, gespeicherte Seeds und Fortschritt bleiben erhalten. Die Vorschau zeigt einen normalen Lauf mit tatsächlich gewählten Upgrade-Karten und eingesammelter Powerzelle.

          Das Savegame-Format bleibt kompatibel. Der Debug-Schlüssel wird aus dem Buildcache wiederverwendet.

          Debug-Testversion: kein fertiger Release und noch nicht auf einem physischen Smartphone getestet. Bei Bedarf die Installation aus dieser Downloadquelle erlauben. Windows und Buildprotokolle stehen im ursprünglichen Actions-Lauf bereit.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "This version already has a direct download; keeping its existing APK."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title 'DEADWAVE HEROES v0.2.7 · Android Debug' --notes-file /tmp/deadwave-release-notes.md release-assets/DeadwaveHeroes-v0.2.7-debug.apk release-assets/SHA256SUMS.txt docs/screenshots/circuit-live-v0.2.7.png docs/screenshots/circuit-power-v0.2.7.png docs/screenshots/circuit-gear-v0.2.7.png docs/screenshots/circuit-gear-comparison-v0.2.7.png docs/previews/DeadwaveHeroes-v0.2.7-motion.mp4
